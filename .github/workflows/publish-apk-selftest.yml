# publish-apk(ほかのリポジトリの APK を Drive に置く Action)の自己テスト。
#
# Drive の代わりにランナー上のフォルダに置き、次を確かめる。
#   - APK・meta.json・icon.png が規約どおりに置かれる
#   - 同じ versionCode の版は置き直さない(force なら置き直す)
#   - 別の鍵で署名した APK は置かない
# APK は Gradle を使わず、ランナーの Android SDK で小さなものを作る(1 分かからない)。
name: publish-apk self-test

on:
  push:
    paths:
      - ".github/actions/publish-apk/**"
      - ".github/workflows/publish-apk.yml"
      - ".github/workflows/publish-apk-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: publish-apk の自己テスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Action の rclone リモート gdrive を、Drive ではなくローカルのフォルダにする
      RCLONE_CONFIG_GDRIVE_TYPE: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 小さな APK を作る
        run: |
          work="$RUNNER_TEMP/selftest"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          platform=$(find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-*' | sort -V | tail -n 1)
          mkdir -p "$work/res/values"
          cat > "$work/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.noxitro.publishapk.selftest" android:versionCode="3" android:versionName="1.2.0">
              <application android:label="@string/app_name" />
          </manifest>
          XML
          cat > "$work/res/values/strings.xml" <<'XML'
          <resources><string name="app_name">自己テスト</string></resources>
          XML
          "$bt/aapt2" compile --dir "$work/res" -o "$work/res.zip"
          "$bt/aapt2" link -o "$work/unsigned.apk" -I "$platform/android.jar" \
            --manifest "$work/AndroidManifest.xml" "$work/res.zip"
          "$bt/zipalign" -f 4 "$work/unsigned.apk" "$work/aligned.apk"
          # 端末に入っている版の鍵(app)と、それとは別の鍵(other)で署名する
          for name in app other; do
            keytool -genkeypair -keystore "$work/$name.jks" -storepass android -keypass android -alias key \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=publish-apk selftest $name" -noprompt
            "$bt/apksigner" sign --ks "$work/$name.jks" --ks-pass pass:android --out "$work/$name.apk" "$work/aligned.apk"
          done
          cert=$(keytool -list -v -keystore "$work/app.jks" -storepass android -alias key \
            | sed -n 's/.*SHA256: //p' | head -n 1)
          printf '自己テストの説明\n' > "$work/description.txt"
          # 1x1 の PNG
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' \
            | base64 --decode > "$work/icon.png"
          {
            echo "TEST_APK=$work/app.apk"
            echo "OTHER_APK=$work/other.apk"
            echo "TEST_CERT=$cert"
            echo "TEST_DESCRIPTION=$work/description.txt"
            echo "TEST_ICON=$work/icon.png"
            echo "DRIVE=$RUNNER_TEMP/drive/builds"
          } >> "$GITHUB_ENV"

      - name: 置く
        uses: ./.github/actions/publish-apk
        with:
          project: selftest
          apk: ${{ env.TEST_APK }}
          description-file: ${{ env.TEST_DESCRIPTION }}
          icon: ${{ env.TEST_ICON }}
          signing-cert-sha256: ${{ env.TEST_CERT }}
          drive-folder: ${{ env.DRIVE }}
          drive-token: unused

      - name: 規約どおりに置けたか確かめる
        shell: python
        run: |
          import hashlib, json, os, pathlib
          folder = pathlib.Path(os.environ["DRIVE"]) / "selftest"
          apk = pathlib.Path(os.environ["TEST_APK"])
          assert sorted(p.name for p in folder.iterdir()) == ["icon.png", "meta.json", "selftest-1.2.0-release.apk"], list(folder.iterdir())
          assert (folder / "selftest-1.2.0-release.apk").read_bytes() == apk.read_bytes()
          assert (folder / "icon.png").read_bytes() == pathlib.Path(os.environ["TEST_ICON"]).read_bytes()
          raw = (folder / "meta.json").read_bytes()
          assert not raw.startswith(b"\xef\xbb\xbf"), "meta.json に BOM がある"
          meta = json.loads(raw)
          assert meta["schema"] == 1 and meta["project"] == "selftest", meta
          assert meta["packageName"] == "com.noxitro.publishapk.selftest", meta
          assert meta["label"] == "自己テスト" and meta["description"] == "自己テストの説明", meta
          [build] = meta["builds"]
          assert build["file"] == "selftest-1.2.0-release.apk" and build["variant"] == "release", build
          assert build["versionName"] == "1.2.0" and build["versionCode"] == 3, build
          assert build["size"] == apk.stat().st_size and build["sha256"] == hashlib.sha256(apk.read_bytes()).hexdigest(), build
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FIRST_UPDATED_AT={meta['updatedAt']}\n")
          print("ok:", json.dumps(meta, ensure_ascii=False))

      - name: 同じ版をもう一度置く(置かないはず)
        uses: ./.github/actions/publish-apk
        with:
          project: selftest
          apk: ${{ env.TEST_APK }}
          signing-cert-sha256: ${{ env.TEST_CERT }}
          drive-folder: ${{ env.DRIVE }}
          drive-token: unused

      - name: 別の鍵で署名した APK を置く(止まるはず)
        id: other-key
        continue-on-error: true
        uses: ./.github/actions/publish-apk
        with:
          project: selftest
          apk: ${{ env.OTHER_APK }}
          signing-cert-sha256: ${{ env.TEST_CERT }}
          drive-folder: ${{ env.DRIVE }}
          drive-token: unused
          force: "true"

      - name: どちらも meta.json を変えていないか確かめる
        env:
          OTHER_KEY_OUTCOME: ${{ steps.other-key.outcome }}
        shell: python
        run: |
          import json, os, pathlib
          assert os.environ["OTHER_KEY_OUTCOME"] == "failure", os.environ["OTHER_KEY_OUTCOME"]
          folder = pathlib.Path(os.environ["DRIVE"]) / "selftest"
          meta = json.loads((folder / "meta.json").read_text(encoding="utf-8"))
          assert meta["updatedAt"] == os.environ["FIRST_UPDATED_AT"], meta
          assert (folder / "selftest-1.2.0-release.apk").read_bytes() == pathlib.Path(os.environ["TEST_APK"]).read_bytes()
          print("ok")

      - name: force で置き直す
        uses: ./.github/actions/publish-apk
        with:
          project: selftest
          apk: ${{ env.TEST_APK }}
          signing-cert-sha256: ${{ env.TEST_CERT }}
          drive-folder: ${{ env.DRIVE }}
          drive-token: unused
          force: "true"

      - name: 置き直しても 1 件のままか確かめる
        shell: python
        run: |
          import json, os, pathlib
          meta = json.loads((pathlib.Path(os.environ["DRIVE"]) / "selftest" / "meta.json").read_text(encoding="utf-8"))
          assert meta["updatedAt"] != os.environ["FIRST_UPDATED_AT"], meta
          assert [b["file"] for b in meta["builds"]] == ["selftest-1.2.0-release.apk"], meta
          assert meta["description"] == "自己テストの説明", meta
          print("ok")
