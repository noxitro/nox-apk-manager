# nox-apk-manager の CI
#
# 目的: 機能追加のたびに、決めたテストが全部通ることと、起動時に落ちないことを確かめる。
#
# 構成
#   unit         … JVM 単体テストとビルド。push のたびに走る。数分。
#   instrumented … エミュレータ上の計装テスト(インストールの E2E)と起動スモーク。
#                  PR と main への push と手動実行で走る。端末は Galaxy 相当と Xiaomi Pad 8 相当の 2 台。
#
# このリポジトリは公開なので、標準の GitHub ホストランナーは無料で、月の無料枠も減らない
# (docs.github.com「GitHub Actions billing」)。非公開の兄弟リポジトリ(book-log など)が
# エミュレータを手動実行に絞っているのは枠を守るためで、ここには当てはまらない。
#
# 「BUILD SUCCESSFUL」は証明にならない。テストが 0 件でも成功で返るので、
# 結果 XML の tests= を数えて最低件数を下回ったら失敗にしている
# (.github/scripts/check-test-results.py)。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同じブランチで新しい push が来たら古い実行は捨てる。無駄な課金を避ける。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 単体テスト ────────────────────────────────────────────
  unit:
    name: 単体テストとビルド
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # テストの正本(docs/TESTING.md)がコードとずれていないか。
      # 正本が黙って古くなると、文書を読んで判断する側が実態と違う結論を出す。
      - name: TESTING.md とコードの突き合わせ
        run: python3 .github/scripts/verify-testing-doc.py

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric は Android の実行環境(android-all、約 200 MB)を ~/.m2 に落とす。
      # setup-gradle は ~/.gradle しか持ち越さないので、ここで持ち越さないと push のたびに取りに行く。
      - name: Robolectric の Android jar を持ち越す
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: 単体テストと debug ビルド
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: 実行件数を確かめる
        if: always()
        run: |
          python3 .github/scripts/check-test-results.py \
            app/build/test-results/testDebugUnitTest \
            --min 31 --label "単体テスト"

      - name: APK とレポートを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

  # ── 計装テストと起動スモーク(エミュレータ)──────────────────
  # 計装テストは、本物の PackageInstaller にダミーのアプリ(:fixture)を入れさせる E2E
  # (app/src/androidTest/.../install/InstallE2ETest.kt)。続けて起動スモークも回す。
  #
  # 端末はユーザーの実機に寄せた 2 台。ただし OS は素の Android なので、
  # One UI / HyperOS が独自に挟む画面や保護機能(オートブロッカーなど)は再現しない。
  # 画面の大きさと Android の版だけを合わせている。
  instrumented:
    name: 計装テスト (${{ matrix.device.name }})
    # PR と main への push で走らせる。ブランチへの push まで回すと、PR を開いている間は
    # 同じ commit で 2 回走るため。
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          # Galaxy 相当。機種は決めていないので、Galaxy S24 の画面(1080×2340)に合わせた。
          # One UI 7 の Android 15。
          - name: Galaxy 相当
            id: galaxy
            api-level: 35
            profile: pixel_6
            size: 1080x2340
            density: 420
          # Xiaomi Pad 8(3200×2136、HyperOS 3 の Android 16)。
          - name: Xiaomi Pad 8 相当
            id: pad8
            api-level: 36
            profile: pixel_tablet
            size: 3200x2136
            density: 400
    steps:
      - uses: actions/checkout@v4

      - name: 空き容量を確保する
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost                       /usr/share/swift /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: KVM を有効にする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # エミュレータの起動前に作っておく。起動してからだと、その間エミュレータが遊ぶ。
      - name: APK を作る
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: 計装テストと起動スモーク
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.device.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # 画面の大きさと密度を実機に合わせてから走らせる(AVD の定義に Galaxy / Xiaomi は無い)。
          script: |
            adb shell wm size ${{ matrix.device.size }}
            adb shell wm density ${{ matrix.device.density }}
            ./gradlew --no-daemon connectedDebugAndroidTest
            bash .github/scripts/launch-smoke.sh com.noxitro.apkmanager .MainActivity

      - name: 実行件数を確かめる
        if: always()
        run: |
          python3 .github/scripts/check-test-results.py app/build/outputs/androidTest-results/connected --min 3 --label "計装テスト"

      - name: ログを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-${{ matrix.device.id }}
          path: |
            logcat-full.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
